name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          # Repository secret or variable (the hash ships in the public bundle either way).
          VITE_LEASEWISE_PASSWORD_HASH: ${{ secrets.VITE_LEASEWISE_PASSWORD_HASH || vars.VITE_LEASEWISE_PASSWORD_HASH }}
        run: |
          case "$VITE_LEASEWISE_PASSWORD_HASH" in
            pbkdf2-sha256\$*) ;;
            "") echo "::error::VITE_LEASEWISE_PASSWORD_HASH is empty. Add it under Settings > Secrets and variables > Actions > Repository secrets."; exit 1 ;;
            *) echo "::error::VITE_LEASEWISE_PASSWORD_HASH must be only the value starting pbkdf2-sha256\$ (without the VITE_...= prefix)."; exit 1 ;;
          esac
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
